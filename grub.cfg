# grub.cfg
# Grub config

# wait five seconds for a choice
set timeout=5
set default=0

# load video drivers
insmod all_video

# boot the kernel
menuentry "rynos" {
    # 800x600 with 32 bits per pixel
    set gfxpayload=800x600x32
    multiboot2 /boot/kernel.bin
    boot
}
